name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep uv's downloads and the venv out of the way of the tool's own .flaky.db.
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  checks:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --python 3.12

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --python ${{ matrix.python }}

      # FLAKY_DEMO_DETERMINISTIC is deliberately NOT set here. The integration
      # tests invoke examples/flaky_demo and expect it to be genuinely flaky; that
      # is the whole point of them. The demo suite is excluded from ordinary
      # collection by `norecursedirs`, so it cannot break this job on its own.
      - name: Run tests
        run: uv run pytest -q --cov=flaky_detective --cov-report=term

  dashboard:
    name: Dashboard bundle is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not "latest": this job asserts the committed bundle byte-matches a
      # fresh build, and asset hashes are only reproducible on the toolchain that
      # produced them. package-lock.json pins the rest.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      - name: Typecheck
        run: npm run typecheck
        working-directory: web

      # The compiled bundle is committed so that `flaky serve` works from a plain
      # `pip install` with no Node toolchain. That convenience is only safe if the
      # committed bundle is provably the one this source produces, so rebuild it and
      # require the tree to come back unchanged. A forgotten `npm run build` fails
      # here instead of shipping a dashboard that renders stale data.
      - name: Rebuild the committed bundle
        run: npm run build
        working-directory: web

      # --porcelain rather than `git diff`, because a changed asset hash arrives as an
      # untracked file plus a deletion, and `git diff` alone would miss the new file.
      - name: The committed bundle must match the rebuild
        run: |
          changed=$(git status --porcelain -- src/flaky_detective/web/static/)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::src/flaky_detective/web/static/ does not match a fresh build."
            echo "Run 'cd web && npm run build' and commit the result."
            exit 1
          fi
          echo "Committed bundle matches the rebuild."

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # An end-to-end check that the server actually serves: real database, real
      # analysis, real HTTP. A dashboard that only passes unit tests can still 500
      # on the first request a judge makes.
      - name: Serve a real database over HTTP
        run: |
          uv sync --python 3.12
          uv run flaky hunt -n 8 --seed 3 --db dash.db -- \
            uv run pytest examples/flaky_demo -p no:cacheprovider -q

          uv run flaky serve --db dash.db --port 8420 --no-open --quiet &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          for _ in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8420/api/health >/dev/null 2>&1 && break
            sleep 0.25
          done

          asset=$(python3 - <<'PY'
          import pathlib, re
          html = pathlib.Path("src/flaky_detective/web/static/index.html").read_text()
          src = re.search(r'src="([^"]+\.js)"', html).group(1)
          print("/" + src.removeprefix("./").lstrip("/"))
          PY
          )

          # The three requests a browser makes, in the order it makes them.
          for path in / "$asset" /api/overview; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8420${path}")
            echo "$path -> $code"
            test "$code" = "200"
          done

          # Payloads must carry real analysis, not an empty shell.
          curl -fsS http://127.0.0.1:8420/api/overview -o overview.json
          python3 - <<'PY'
          import json, pathlib

          payload = json.loads(pathlib.Path("overview.json").read_text())
          score = payload["trust"]
          assert payload["tests"], "no tests in overview payload"
          assert 0 <= score["score"] <= 100, score

          # The score is only defensible if it is fully decomposed: the components must
          # account for every point deducted, and the headline number must be nothing
          # more than that deduction rounded.
          penalties = sum(c["penalty"] for c in score["components"])
          assert abs(penalties - score["deducted"]) < 0.05, (penalties, score["deducted"])
          expected = max(0, min(100, round(100 - score["deducted"])))
          assert score["score"] == expected, (score["score"], expected)

          print(f"trust score {score['score']}/100 over {len(payload['tests'])} tests")
          PY

  dogfood:
    name: Run the tool on itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Same-commit divergence needs a commit SHA, and shallow clones still
          # provide HEAD, so depth 1 is fine. Kept explicit because it matters.
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --python 3.12

      # Part one: find the flakes planted in examples/flaky_demo. This is the
      # demonstration that the tool works on genuine nondeterminism.
      - name: Hunt the demo suite
        run: |
          uv run flaky hunt -n 20 --seed 1 -- \
            uv run pytest examples/flaky_demo -p no:cacheprovider -q

      - name: Analyze
        run: uv run flaky analyze --limit 30

      - name: Database summary
        run: uv run flaky stats

      - name: Render reports
        run: |
          uv run flaky report --format html --output artifacts/flaky-report.html
          uv run flaky report --format json --output artifacts/flaky-report.json
          uv run flaky report --format md --output artifacts/flaky-report.md

      - name: Show what would be quarantined
        run: uv run flaky quarantine recommend

      # Part two: publish the tool's own measured accuracy. A detector that cannot
      # state its own false-positive rate is asking for the blind trust it exists to
      # replace, so the numbers go in the job summary on every run.
      - name: Measure accuracy against ground truth
        run: |
          uv run flaky benchmark --format md >> "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "#### Accuracy vs history available"
            uv run flaky benchmark --sweep runs
            echo ""
            echo "#### Accuracy vs commit coverage"
            uv run flaky benchmark --sweep coverage
          } >> "$GITHUB_STEP_SUMMARY"
          uv run flaky benchmark --format json --output artifacts/accuracy.json

      # Part two and a half: the real-world numbers. Scoring the committed results takes
      # seconds and needs no network, so there is no excuse for the figures in
      # docs/real-world.md to drift away from the recorded runs they came from. The
      # thresholds below are the published claims; if a scoring change moves them, this
      # fails and the documentation gets updated deliberately rather than silently.
      - name: Re-score the real-world validation
        run: |
          mkdir -p artifacts
          uv run flaky validate validation/results >> "$GITHUB_STEP_SUMMARY"
          uv run flaky validate validation/results --format json --output artifacts/real-world.json

          python3 - <<'PY'
          import json, pathlib

          published = pathlib.Path("artifacts/real-world.json")
          data = json.loads(published.read_text())

          checks = {
              "repositories": (data["repositories"], 12),
              "labels_detected": (data["labels_detected"], 174),
              "labels_reproduced": (data["labels_reproduced"], 175),
              "flagged": (data["flagged"], 183),
              "flagged_with_divergence": (data["flagged_with_divergence"], 183),
              "wrongly_called_flaky": (data["wrongly_called_flaky"], 0),
          }
          problems = [
              f"{name}: scored {got}, README and docs/real-world.md claim {want}"
              for name, (got, want) in checks.items()
              if got != want
          ]
          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              raise SystemExit(1)

          print(f"recall {data['recall']:.1%}, precision {data['precision']:.1%} "
                f"over {data['repositories']} repositories -- matches the published figures")
          PY

      # Part three: prove history merges correctly across independent machines.
      - name: Verify history merging
        run: |
          uv run flaky hunt -n 4 --seed 101 --db shard-a.db -- \
            uv run pytest examples/flaky_demo -p no:cacheprovider -q
          uv run flaky hunt -n 4 --seed 202 --db shard-b.db -- \
            uv run pytest examples/flaky_demo -p no:cacheprovider -q

          cp shard-a.db merged.db
          uv run flaky merge shard-b.db --into merged.db
          # Merging is a set union over content-addressed ids, so a second merge must
          # add nothing at all.
          uv run flaky merge shard-b.db --into merged.db | tee /tmp/second-merge.txt
          grep -q "Merged 0 runs" /tmp/second-merge.txt

      - name: Post the report on the pull request
        if: github.event_name == 'pull_request'
        run: cat artifacts/flaky-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: flaky-reports
          path: artifacts/
          if-no-files-found: error

      # Part four: the tool's own test suite must be clean. If flaky-test-detective
      # has flaky tests, nothing it reports is trustworthy.
      #
      # Integration tests are excluded because they hunt the demo suite themselves,
      # and nesting a hunt inside a hunt only wastes runner minutes.
      - name: Prove this project's own suite is stable
        run: |
          uv run flaky hunt -n 3 --seed 7 --db .flaky-self.db -- \
            uv run pytest -q -m "not integration" -p no:cacheprovider
          uv run flaky analyze --db .flaky-self.db --fail-on flaky

  action:
    name: The published Action, used on this repo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Produce a JUnit report with real flakes in it
        run: |
          uv sync --python 3.12
          mkdir -p reports
          uv run pytest examples/flaky_demo -p no:cacheprovider -q \
            --junitxml=reports/junit.xml || true

      # `./` uses the action.yml in this checkout, which is how a composite action
      # gets dogfooded in its own repository. If the action is broken, this fails.
      - name: Flaky Test Detective
        id: flaky
        uses: ./
        with:
          report-path: reports/junit.xml
          # Reporting only: the demo suite is deliberately flaky and contains a
          # deliberately broken test, so a gating run here would always fail.
          fail-on: none
          cache-key: flaky-action-demo

      - name: Show the outputs the action exposes
        run: |
          echo "exit code      : ${{ steps.flaky.outputs.exit-code }}"
          echo "actionable     : ${{ steps.flaky.outputs.actionable }}"
          echo "known flakes   : ${{ steps.flaky.outputs.known-flakes }}"
          echo "all known flaky: ${{ steps.flaky.outputs.all-known-flaky }}"
          echo "summary        : ${{ steps.flaky.outputs.summary }}"

          # test_known_broken always fails and is never a flake, so the action must
          # report at least one failure needing a human.
          test "${{ steps.flaky.outputs.actionable }}" -ge 1

name: Pages

# Publishes a small sample-output site so a reviewer can see working output without
# installing anything.
#
# What is NOT published, deliberately: the interactive dashboard. It reads a local SQLite
# file and serves from the user's own machine, which is the property that makes it safe to
# point at a private test suite. Hosting it would mean either shipping someone's test
# history to a server or standing up a service this project claims not to need.
#
# What IS published is a self-contained analysis report built from `flaky demo` -- generated
# data, labelled as generated on the landing page, so a reviewer cannot mistake it for a
# measurement. The real measurements stay in docs/ where they are reproducible by command.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the sample site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --python 3.12

      - name: Build the site
        run: |
          uv run flaky demo --db demo.db --no-serve

          # Landing page, dashboard (bundle + injected static flag), and the API payloads
          # the dashboard would otherwise fetch from `flaky serve`.
          uv run python docs/pages/build.py demo.db site

          uv run flaky report --db demo.db --format html --output site/report.html

      - name: The published site must hold its own claims
        run: |
          # No external origin. A page that quietly reached out to a font service would
          # still render, and would make the "no CDN" claim on it false.
          if grep -rqiE 'https?://(cdn|unpkg|fonts\.|ajax\.)' site/index.html site/report.html; then
            echo "A page references an external origin. The site claims it does not."
            exit 1
          fi

          # The landing page must keep saying the data is generated. Losing that line is
          # how a labelled sample turns into a misleading one.
          grep -q "generated demo data" site/index.html

          # The dashboard has to be in static mode, or it will try to reach a server that
          # does not exist and show a connection error to every reviewer.
          grep -q "__FTD_STATIC__=true" site/dashboard/index.html

          # Every test the overview lists must have a detail payload, otherwise clicking a
          # row 404s. build.py already fails on this; asserted here too because it is the
          # one way this site can look broken rather than merely incomplete.
          uv run python - <<'PY'
          import json, pathlib
          root = pathlib.Path("site/dashboard/api")
          overview = json.loads((root / "overview.json").read_text())
          details = json.loads((root / "tests.json").read_text())["tests"]
          missing = [t["test_id"] for t in overview["tests"] if t["test_id"] not in details]
          assert not missing, f"no detail payload for: {missing}"
          print(f"{len(details)} test payloads, all reachable")
          PY

          find site -type f | sort

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

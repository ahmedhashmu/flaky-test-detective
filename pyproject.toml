[project]
name = "flaky-test-detective"
version = "0.1.0"
description = "Find and diagnose flaky tests from the JUnit XML your test runner already produces"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["testing", "flaky", "ci", "junit", "pytest", "jest", "test-health"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.urls]
Repository = "https://github.com/ahmedhashmu/flaky-test-detective"
Issues = "https://github.com/ahmedhashmu/flaky-test-detective/issues"

[project.scripts]
flaky = "flaky_detective.cli:main"

[project.optional-dependencies]
# Declared as an extra as well as a dependency group so that plain pip can install
# the development tools. `uv sync` uses the group below; `pip install -e ".[dev]"`
# uses this. PEP 735 dependency groups are not installable by pip before 25.1, and
# the documented test instructions have to work on the pip people already have.
#
# Single source of truth: the group references this extra, so there is only one
# list of pins. tests/test_architecture.py asserts they stay in agreement.
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    # Provides --randomly-seed, which `flaky hunt --shuffle` probes for. Without
    # it, order-dependent flakes in the demo suite cannot be provoked.
    "pytest-randomly>=3.15.0",
    # Property-based tests in tests/test_properties.py. Development only: it
    # generates the histories that the invariants are checked against, and nothing
    # in the shipped package imports it. The two runtime dependencies stay at two.
    "hypothesis>=6.100.0",
]

[dependency-groups]
dev = ["flaky-test-detective[dev]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flaky_detective"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# examples/ holds a deliberately flaky suite used as a fixture for this tool.
# It must never run as part of this project's own test suite.
# `.hypothesis` is listed because setting this option replaces pytest's defaults
# rather than extending them, and Hypothesis warns when its example database ends
# up inside the collected tree.
norecursedirs = ["examples", ".git", ".venv", "build", "dist", ".hypothesis"]
addopts = "-q --strict-markers"
markers = [
    "integration: exercises the full pipeline, slower than a unit test",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "S",    # bandit (security)
    "PTH",  # prefer pathlib
    "RET",  # return consistency
]
ignore = [
    "S101",  # assert is fine in tests and in internal invariants
]

[tool.ruff.lint.isort]
known-first-party = ["flaky_detective"]
# conftest is imported by name from within tests/, which is on sys.path there.
known-local-folder = ["conftest"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately shell out, and use `random` to build shuffled scenarios.
"tests/*" = ["S603", "S607", "S311"]
# The demo suite's whole purpose is genuine nondeterminism. Unseeded `random` and
# real sockets are the feature, not an oversight.
"examples/*" = ["S311"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
